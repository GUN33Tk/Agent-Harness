<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Console — Agent Execution Boundary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C;
    --panel: #1B1F26;
    --panel-alt: #20252D;
    --border: #2B313B;
    --text: #E7E4DD;
    --muted: #8B919C;
    --allow: #4FA98A;
    --deny: #C1502E;
    --warn: #D9A441;
    --steel: #5B8CBE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .sub {
    color: var(--muted);
    font-size: 12.5px;
    margin-left: 10px;
  }
  header .actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
  }
  header .actions button:hover { border-color: var(--steel); color: var(--text); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 250px 1fr 320px;
    overflow: hidden;
  }

  .rail {
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    overflow-y: auto;
  }
  .rail .label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 4px 8px 10px;
  }
  .scenario-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: 10px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .scenario-btn:hover { background: var(--panel-alt); }
  .scenario-btn.active { background: var(--panel-alt); border-color: var(--steel); }
  .scenario-btn .name { font-size: 13px; font-weight: 500; }
  .scenario-btn .desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  .timeline {
    padding: 20px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .timeline .empty {
    color: var(--muted);
    font-size: 13px;
    margin-top: 40px;
    text-align: center;
  }
  .entry {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    animation: slidein 0.18s ease-out;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    flex-shrink: 0;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-top: 1px;
  }
  .badge.ALLOW { background: rgba(79,169,138,0.15); color: var(--allow); }
  .badge.DENY  { background: rgba(193,80,46,0.15); color: var(--deny); }
  .badge.WARN  { background: rgba(217,164,65,0.15); color: var(--warn); }
  .entry .gate { color: var(--muted); min-width: 128px; flex-shrink: 0; }
  .entry .detail { color: var(--text); }

  .signal {
    border-left: 1px solid var(--border);
    padding: 18px 16px;
    overflow-y: auto;
  }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .card .num { font-size: 20px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .card .lbl { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .card.wide { grid-column: span 2; }

  .signal h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .stage {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: 5px;
    margin-bottom: 3px;
    font-size: 12px;
    border: 1px solid transparent;
  }
  .stage .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .stage.pass { color: var(--allow); background: rgba(79,169,138,0.08); }
  .stage.pass .dot { background: var(--allow); }
  .stage.fail { color: var(--deny); background: rgba(193,80,46,0.08); }
  .stage.fail .dot { background: var(--deny); }
  .stage.skip { color: var(--muted); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Harness Console<span class="sub">agent execution boundary — live trace</span></h1>
  </div>
  <div class="actions">
    <button onclick="resetSession()">Reset session</button>
  </div>
</header>

<div class="layout">
  <div class="rail">
    <div class="label">Scenarios</div>
    <div id="scenario-list"></div>
  </div>

  <div class="timeline" id="timeline">
    <div class="empty">Select a scenario on the left to run it through the boundary.</div>
  </div>

  <div class="signal">
    <h2>Session</h2>
    <div class="cards">
      <div class="card"><div class="num" id="stat-total">0</div><div class="lbl">Total calls</div></div>
      <div class="card"><div class="num" id="stat-blocked">0</div><div class="lbl">Blocked</div></div>
      <div class="card wide"><div class="num" id="stat-scenario" style="font-size:13px;">—</div><div class="lbl">Active scenario</div></div>
    </div>

    <h2>Pipeline trace (last run)</h2>
    <div id="pipeline"></div>
  </div>
</div>

<script>
const PIPELINE_STAGES = [
  { key: "killswitch", label: "Kill switch" },
  { key: "provenance",  label: "Provenance / privilege" },
  { key: "budget",      label: "Budget ceiling" },
  { key: "egress",      label: "Egress allowlist + DNS" },
  { key: "registry",    label: "Scope + schema" },
  { key: "sandbox",     label: "Sandbox executor (C++)" },
];

// ---- Simulated harness state (mirrors src/*.ts) ----
let killSwitchOn = false;
const approvedMcpHash = { "web.summarize": "a1f9c2" }; // pinned hash from first approval
const budgetSpent = {};
const BUDGET_LIMITS = { fetch_url: 3 };
const EGRESS_ALLOWLIST = new Set(["vendor-pricing.example.com"]);
const PRIVILEGED_TOOLS = new Set(["send_email", "delete_file", "read_billing"]);

let totalCalls = 0, totalBlocked = 0;

const SCENARIOS = {
  baseline: {
    name: "Baseline query",
    desc: "Ordinary scoped tool call — everything allowed",
    run: () => runSteps([
      step("registry", "ALLOW", "read_billing", "scope 'pricing-research' permitted, schema valid"),
      step("sandbox", "ALLOW", "sandbox", "executed inside isolated process, result returned"),
    ], ["killswitch","provenance","budget","egress","registry","sandbox"])
  },
  injection: {
    name: "Indirect prompt injection",
    desc: "Webpage instructs the agent to email internal data",
    run: () => runSteps([
      step("registry", "ALLOW", "fetch_url", "vendor-pricing.example.com is allowlisted"),
      step("sanitizer", "WARN", "scan", "fetched content matches pattern: /ignore previous instructions/i — flagged, not blocked yet"),
      step("provenance", "DENY", "send_email", "call derived_from_untrusted=true, send_email is a privileged tool — DENIED before dispatch"),
    ], ["killswitch","provenance"])
  },
  ssrf: {
    name: "Network piggybacking (SSRF)",
    desc: "fetch_url targets the internal metadata IP directly",
    run: () => runSteps([
      step("egress", "DENY", "fetch_url", "host '169.254.169.254' not in EGRESS_ALLOWLIST"),
    ], ["killswitch","provenance","budget","egress"])
  },
  rebinding: {
    name: "DNS rebinding",
    desc: "Allowlisted hostname resolves to a private IP at request time",
    run: () => runSteps([
      step("egress", "DENY", "fetch_url", "vendor-pricing.example.com allowlisted, but resolves to 169.254.169.254 — private range, DENIED"),
    ], ["killswitch","provenance","budget","egress"])
  },
  rugpull: {
    name: "MCP tool rug pull",
    desc: "Approved tool's description silently changes",
    run: () => runSteps([
      step("mcp-trust", "DENY", "web.summarize", "sha256 of description no longer matches approved hash 'a1f9c2' — re-review required"),
    ], ["killswitch"])
  },
  budget: {
    name: "Budget exhaustion",
    desc: "fetch_url called past its per-session cost ceiling",
    run: () => runSteps([
      step("budget", "ALLOW", "fetch_url", "call 1/3 within budget"),
      step("budget", "ALLOW", "fetch_url", "call 2/3 within budget"),
      step("budget", "ALLOW", "fetch_url", "call 3/3 within budget"),
      step("budget", "DENY", "fetch_url", "call 4 exceeds budget ceiling of 3 — DENIED, chain halted"),
    ], ["killswitch","provenance","budget"])
  },
  killswitch: {
    name: "Kill switch engaged",
    desc: "Operator halts the agent mid-session",
    run: () => {
      killSwitchOn = true;
      return runSteps([
        step("killswitch", "DENY", "any_tool", "kill switch flag present on disk — every call halted regardless of tool or scope"),
      ], []);
    }
  }
};

function step(gate, verdict, tool, detail) {
  return { gate, verdict, tool, detail };
}

function stageForGate(gate) {
  if (gate === "sanitizer" || gate === "mcp-trust") return null; // shown in log only, not a pipeline stage box
  return gate;
}

function runSteps(steps, passedStages) {
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";
  renderPipeline([]); // reset to all-skip first

  let delay = 0;
  steps.forEach((s, i) => {
    delay += 260;
    setTimeout(() => {
      appendEntry(s);
      totalCalls++;
      if (s.verdict === "DENY") totalBlocked++;
      updateStats();

      // update pipeline trace progressively
      const reachedSoFar = passedStages.slice(0, passedStages.indexOf(stageForGate(s.gate)) + 1);
      const failedHere = s.verdict === "DENY" ? stageForGate(s.gate) : null;
      renderPipeline(passedStages, failedHere);
    }, delay);
  });
}

function appendEntry(s) {
  const timeline = document.getElementById("timeline");
  const el = document.createElement("div");
  el.className = "entry";
  el.innerHTML = `
    <span class="badge ${s.verdict}">${s.verdict}</span>
    <span class="gate">${s.gate} · ${s.tool}</span>
    <span class="detail">${s.detail}</span>
  `;
  timeline.appendChild(el);
  timeline.scrollTop = timeline.scrollHeight;
}

function renderPipeline(passedStages, failedAt) {
  const container = document.getElementById("pipeline");
  container.innerHTML = "";
  PIPELINE_STAGES.forEach(st => {
    const div = document.createElement("div");
    let cls = "skip";
    if (failedAt === st.key) cls = "fail";
    else if (passedStages.includes(st.key)) cls = "pass";
    div.className = "stage " + cls;
    div.innerHTML = `<span class="dot"></span>${st.label}`;
    container.appendChild(div);
  });
}

function updateStats() {
  document.getElementById("stat-total").textContent = totalCalls;
  document.getElementById("stat-blocked").textContent = totalBlocked;
}

function resetSession() {
  totalCalls = 0; totalBlocked = 0; killSwitchOn = false;
  updateStats();
  document.getElementById("stat-scenario").textContent = "—";
  document.getElementById("timeline").innerHTML = '<div class="empty">Select a scenario on the left to run it through the boundary.</div>';
  renderPipeline([]);
  document.querySelectorAll(".scenario-btn").forEach(b => b.classList.remove("active"));
}

function renderRail() {
  const rail = document.getElementById("scenario-list");
  Object.entries(SCENARIOS).forEach(([id, sc]) => {
    const btn = document.createElement("button");
    btn.className = "scenario-btn";
    btn.innerHTML = `<div class="name">${sc.name}</div><div class="desc">${sc.desc}</div>`;
    btn.onclick = () => {
      document.querySelectorAll(".scenario-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("stat-scenario").textContent = sc.name;
      sc.run();
    };
    rail.appendChild(btn);
  });
}

renderRail();
renderPipeline([]);
</script>
</body>
</html>
